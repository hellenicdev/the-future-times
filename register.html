<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - The Future Times</title>
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ai-disclaimer"><strong>AI-Generated Content &middot; Fictional</strong> &mdash; Every article on this site is entirely generated by artificial intelligence and is purely fictional.</div>
  <header class="masthead" style="padding:20px;">
    <h1 style="font-size:2rem;"><a href="index.html" style="color:var(--black);">The Future Times</a></h1>
  </header>
  <div class="container">
    <main class="form-container">
      <h2>Create Account</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input type="password" id="password" required minlength="8">
        </div>
        <div id="turnstile-container" style="margin-bottom:16px;"></div>
        <button type="submit" class="btn btn-full">Register</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-family:var(--font-sans);font-size:0.85rem;">
        Already have an account? <a href="login.html">Login</a>
      </p>
      <p id="register-error" style="color:var(--red);text-align:center;margin-top:12px;font-family:var(--font-sans);font-size:0.85rem;"></p>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const name = document.getElementById('name').value
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const errorEl = document.getElementById('register-error')
      errorEl.textContent = ''
      try {
        const data = await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email, password, name }),
        })
        setToken(data.token)
        setUser(data.user)
        window.location.href = 'index.html'
      } catch (err) {
        errorEl.textContent = err.message
      }
    })
  </script>
</body>
</html>
